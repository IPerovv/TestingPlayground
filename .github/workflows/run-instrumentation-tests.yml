name: Run Instrumentation Tests
on:
  workflow_call:

jobs:
  instrumentation-tests:
    name: Run Instrumentation Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "No KVM device found!"

      - uses: ./.github/actions/setup-android

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: app/build/
        continue-on-error: true

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 120000
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim

          script: |
            adb wait-for-device
            echo "Waiting 20s extra for system stability..."
            sleep 20
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82 || true  # don’t fail if input service not ready
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumentation test reports
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/connected/
